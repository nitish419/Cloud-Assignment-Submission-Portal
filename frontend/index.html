<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cloud Assignment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">

    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-3xl font-bold mb-6 text-blue-600">Cloud Assignment Portal</h1>

        <!-- Login Section -->
        <div id="auth-section" class="mb-8 p-4 border rounded">
            <h2 class="text-xl font-bold mb-4">Login</h2>
            <input id="email" type="email" placeholder="Email" class="border p-2 w-full mb-2">
            <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-4">
            <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
            <p id="auth-msg" class="text-red-500 mt-2"></p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 id="welcome-text" class="text-2xl font-bold">Welcome</h2>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
            </div>

            <!-- Teacher Controls -->
            <div id="teacher-controls" class="hidden mb-8 p-4 bg-gray-50 border rounded">
                <h3 class="font-bold mb-2">Create Assignment (Teacher Only)</h3>
                <input id="title" placeholder="Title" class="border p-2 w-full mb-2">
                <input id="desc" placeholder="Description" class="border p-2 w-full mb-2">
                <input id="deadline" type="datetime-local" class="border p-2 w-full mb-2">
                <input id="marks" type="number" placeholder="Max Marks" class="border p-2 w-full mb-4">
                <button onclick="createAssignment()" class="bg-green-500 text-white px-4 py-2 rounded">Create</button>
            </div>

            <!-- Assignment List -->
            <div>
                <h3 class="font-bold text-xl mb-4">Assignments</h3>
                <div id="assignments-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api";
        let token = localStorage.getItem("token");
        let userRole = localStorage.getItem("role");

        if (token) showDashboard();

        async function login() {
            const formData = new FormData();
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);

            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                body: formData
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("role", data.role);
                token = data.access_token;
                userRole = data.role;
                showDashboard();
            } else {
                document.getElementById('auth-msg').innerText = "Invalid credentials";
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Welcome (${userRole})`;

            if (userRole === 'teacher') {
                document.getElementById('teacher-controls').classList.remove('hidden');
            }
            loadAssignments();
        }

        async function createAssignment() {
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('desc').value);
            formData.append('deadline', document.getElementById('deadline').value + ":00"); // format fix
            formData.append('max_marks', document.getElementById('marks').value);

            await fetch(`${API_URL}/assignments`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });
            loadAssignments();
        }

        async function loadAssignments() {
            const res = await fetch(`${API_URL}/assignments`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const assignments = await res.json();
            const list = document.getElementById('assignments-list');
            list.innerHTML = "";

            assignments.forEach(a => {
                const div = document.createElement('div');
                div.className = "p-4 border rounded shadow-sm bg-white";
                let inner = `<h4 class="font-bold text-lg">${a.title}</h4>
                             <p class="text-gray-600">${a.description}</p>
                             <p class="text-sm text-red-500 mb-2">Deadline: ${a.deadline}</p>`;

                if (userRole === 'student') {
                    inner += `<input type="file" id="file-${a.id}" class="mb-2 block">
                              <button onclick="submitFile(${a.id})" class="bg-blue-500 text-white px-3 py-1 rounded text-sm">Upload File</button>`;
                }
                div.innerHTML = inner;
                list.appendChild(div);
            });
        }

        async function submitFile(assignId) {
            const fileInput = document.getElementById(`file-${assignId}`);
            if (!fileInput.files[0]) return alert("Select a file");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch(`${API_URL}/assignments/${assignId}/submit`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });
            const result = await res.json();
            alert(result.message || "Uploaded!");
        }
    </script>
</body>

</html>
